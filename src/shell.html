<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Infinite Maze</title>
<style>
html, body {
  margin: 0; height: 100%; background: #0d0a14; overflow: hidden; overscroll-behavior: none;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; image-rendering: pixelated; }
#screen { position: fixed; }
#safe {
  position: fixed; inset: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#touch { display: none; position: fixed; inset: 0; pointer-events: none; }
#touch > * { position: fixed; pointer-events: auto; touch-action: none; }
#touch button {
  display: none; align-items: center; justify-content: center; padding: 0; margin: 0;
  background: var(--bg); border: 2px solid var(--edge); border-radius: 6px; cursor: default;
}
#touch button.down { background: var(--bg-down); border-color: var(--gold); }
#touch button canvas { image-rendering: pixelated; }
#pad, #fire { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<div id="safe"></div>
<div id="touch"></div>
<script>
/*BUNDLE*/
</script>
</body>
</html>
